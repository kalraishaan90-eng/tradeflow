<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | TradeFlow</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #000; color: #F8FAFC;
      font-family: 'DM Sans', system-ui, sans-serif; text-align: center; padding: 24px;
    }
    .card {
      border: 1px solid #1E2535; background: #0B0E0D; border-radius: 16px;
      padding: 48px 40px; max-width: 440px;
      box-shadow: 0 0 40px rgba(93, 211, 148, 0.08);
    }
    .code { font-family: 'JetBrains Mono', monospace; font-size: 64px; font-weight: 700;
      background: linear-gradient(135deg, #367C5B, #5DD394); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { color: #94A3B8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    a.btn {
      display: inline-block; padding: 12px 28px; border-radius: 10px; text-decoration: none;
      font-weight: 700; color: #000; background: linear-gradient(135deg, #367C5B, #5DD394);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(93, 211, 148, 0.4); }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>This trade didn't execute</h1>
    <p>The page you're looking for doesn't exist — or was delisted. Head back to the trading floor.</p>
    <a class="btn" href="/">Back to TradeFlow</a>
  </main>
</body>
</html>
