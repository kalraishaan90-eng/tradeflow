    <style>
      /* Pre-React loading fallback so first paint is on-brand */
      html, body { margin: 0; background: #F6EEE1; color: #121214; }
      #root:empty::after {
        content: "";
        position: fixed; inset: 0;
        background: radial-gradient(circle at 50% 45%, #FFFFFF 0%, #F6EEE1 65%);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse { 0%,100% { opacity: .3 } 50% { opacity: .8 } }
    </style>
